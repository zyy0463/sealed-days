        "Segoe UI Symbol","Apple Symbols","Noto Sans Symbols 2",serif;

       "Songti SC","Segoe UI Symbol","Apple Symbols",serif;

/* 从月树点牌进来：白框 0.2s 铺满全屏、0.35s 跳转（月树页），
   到这里**各部分依次慢慢浮现**（底图→题名→档案→统计→时间签→正文→落款）——
   浮现可以慢点。步长 0.12s、每块 0.7s，≈1.44s 走完 */
.page>*{animation:rise .7s ease both}
.page>:nth-child(1){animation-delay:.02s}
.page>:nth-child(2){animation-delay:.14s}
.page>:nth-child(3){animation-delay:.26s}
.page>:nth-child(4){animation-delay:.38s}
.page>:nth-child(5){animation-delay:.5s}
.page>:nth-child(6){animation-delay:.62s}
.page>:nth-child(7){animation-delay:.74s}
.page>:nth-child(n+8){animation-delay:.86s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.page>*{animation:none}}
/* v11 自适应：整页至少撑满一屏（svh 兜底手机地址栏），纵向 flex 布局 ——
   文段短时信笺区 .letter 弹性伸展，横线一直铺到页底，落款钉在最下面 */
.page{max-width:820px;margin:0 auto;background:var(--paper);
  box-shadow:0 34px 80px -56px rgba(0,0,0,.5);
  min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
@media(max-width:859px){.page{box-shadow:none}}

/* ── 卷首：照片 ── */
.hero{position:relative;height:clamp(164px,28vh,282px);overflow:hidden}
.hero-bg{position:absolute;inset:0;
  background:linear-gradient(160deg,#f2f4ee 0%,#e3e9dd 46%,#d5ded1 100%) 74% 18%/cover no-repeat;
  filter:grayscale(1) brightness(1.05) contrast(.9)}
.hero-veil{position:absolute;inset:0;background:
  radial-gradient(122% 96% at 2% 94%,rgba(250,250,250,.99) 0%,rgba(250,250,250,.86) 30%,rgba(250,250,250,0) 62%),
  linear-gradient(to bottom,rgba(250,250,250,0) 28%,rgba(250,250,250,.72) 64%,#fafafa 100%)}
/* 树冠浅绿（仅封存树模式）：右上角树底图渲染一块浅绿，multiply 吃进灰阶照片、
   三团 radial 交叠铺开范围，边缘自然淡出；正常详情页不渲染（22:48 定） */
.hero-canopy{display:none}
body.seal-mode .hero-canopy{display:block;position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;
  background:
    radial-gradient(44% 56% at 74% 24%,rgba(146,183,118,.5) 0%,rgba(146,183,118,.3) 36%,rgba(146,183,118,0) 72%),
    radial-gradient(30% 36% at 60% 42%,rgba(158,192,131,.34) 0%,rgba(158,192,131,0) 70%),
    radial-gradient(26% 32% at 86% 46%,rgba(158,192,131,.3) 0%,rgba(158,192,131,0) 70%)}

/* 手写题名压在照片下缘；v11 卷首整块回**居中**（还是居中吧），题名同步放大 */
.titlewrap{margin:calc(-1 * clamp(20px,4.6vw,40px)) var(--pad) 0;position:relative;z-index:2;text-align:center}
.titlewrap h1{margin:0;font-weight:400;font-family:var(--hand);
  font-size:clamp(38px,8.8vw,68px);line-height:1;color:#191919;letter-spacing:.01em}
/* 档案标签：两侧各一段细横线，整块居中（线浅、离字有呼吸） */
.arch{margin:clamp(10px,1.7vw,16px) var(--pad) 0;display:flex;justify-content:center;align-items:center;
  gap:clamp(13px,2.2vw,20px);
  color:#a4a4a4;font-weight:400;font-family:var(--zh);
  font-size:clamp(11px,1.6vw,12.5px);letter-spacing:.3em;text-indent:.3em}
.arch i{flex:0 0 auto;width:clamp(34px,8.4vw,88px);height:1px;background:#e3e3e3}
.arch span{flex:0 0 auto}

/* ── 那一天：一行细灰小字、**居中**；统计数字与日期同一支西文字体、同一档字号，
      间距收紧「靠在一起」（v11：.sep 从 .62em 收到 .34em，周一贴日期）── */
.daymeta{padding:clamp(13px,2.1vw,19px) var(--pad) 0;text-align:center}
.dayline{margin:0;font-family:var(--zh);font-size:clamp(11px,1.5vw,12px);
  color:#a5a5a5;letter-spacing:.1em;line-height:1.5}
.dayline .dnum,.dayline b{font-family:var(--lat);font-weight:400;font-size:1.22em;letter-spacing:.05em}
.dayline .dnum{color:#a5a5a5}
.dayline b{color:#8e8e8e}
.dayline .wk{color:#bcbcbc;margin-left:.4em;letter-spacing:.16em}
.dayline .sep{color:#d4d4d4;margin:0 .34em}

/* ── 时间签：一排横滑，放不下就滑（右侧渐隐提示）
      要求：时间下面不要横线 → 无贯穿线、无选中下划线，选中只靠墨色 ── */
.tabswrap{position:relative;margin:clamp(14px,2.4vw,22px) var(--pad) 0}
.tabs{display:flex;flex-wrap:nowrap;gap:0 clamp(13px,2vw,20px);
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none;
  -webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabswrap::after{content:"";position:absolute;right:0;top:0;bottom:0;
  width:clamp(22px,3.6vw,36px);pointer-events:none;
  background:linear-gradient(to right,rgba(250,250,250,0),#fafafa)}
.tab{flex:0 0 auto;font-family:var(--lat);font-style:italic;font-weight:600;
  font-size:clamp(13.5px,1.85vw,16px);line-height:1;color:#c4c4c4;background:none;border:0;
  padding:0 0 clamp(5px,0.9vw,8px);cursor:pointer;position:relative;
  font-variant-numeric:tabular-nums;transition:color .15s}
.tab:hover{color:#8a8a8a}
.tab.on{color:#191919}
.tab .dot{font-style:normal;font-size:7.5px;color:#c4c4c4;margin-left:3px;vertical-align:2px}
.tab.on .dot{color:#8f8f8f}

/* ── 信笺：只有浅浅的横线，34px 一档；顶部不留白——首条线被时间行盖住，
      时间签和信笺贴得近，之间不再露出一条线 ── */
.letter{flex:1 0 auto;margin:clamp(8px,1.4vw,13px) var(--pad) 0;padding:0 0 34px;position:relative;
  font-size:14.5px;line-height:34px;color:#4a4a4a;
  background-image:repeating-linear-gradient(to bottom,
    rgba(0,0,0,0) 0px,rgba(0,0,0,0) 33px,var(--rule) 33px,var(--rule) 34px)}
.lhead{height:34px;display:flex;align-items:baseline;gap:12px;
  background:var(--paper);position:relative;z-index:1}
.lwho{font-family:var(--zh);font-weight:400;font-size:clamp(12.5px,1.65vw,14px);
  color:#4a4a4a;letter-spacing:.16em}
.lmeta{margin-left:auto;font-family:var(--zh);font-size:clamp(10px,1.3vw,11px);
  color:#b6b6b6;letter-spacing:.07em}
.lsub{font-size:12px;color:#7f7f7f;letter-spacing:.03em}
.lms{font-family:var(--zh);font-size:12px;color:#7f7f7f;letter-spacing:.06em}
.letter p{margin:0}
.letter p+p{margin-top:34px}
.fadein{animation:fadeUp .36s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ── 落款 ── */
.signoff{padding:clamp(14px,2.2vw,22px) var(--pad) clamp(30px,4.6vw,48px);text-align:right}
.seal{font:inherit;font-family:var(--zh);font-style:normal;font-weight:400;
  font-size:clamp(12.5px,1.65vw,14px);letter-spacing:.16em;color:#4a4a4a;background:none;
  border:0;cursor:pointer;padding:6px 2px;transition:color .15s}
.seal:hover{color:#000}

/* ── 左上角退出键：一个干净的 ‹（CSS 画，不依赖字体字形）── */
.backbtn{position:fixed;top:clamp(10px,1.8vw,18px);left:clamp(12px,2vw,22px);z-index:9;
  background:none;border:0;cursor:pointer;padding:10px 12px;color:#8f8f8f;transition:color .15s}
.backbtn:hover{color:#000}
.backbtn i{display:block;width:12px;height:12px;
  border-left:1.4px solid currentColor;border-bottom:1.4px solid currentColor;
  transform:rotate(45deg) translate(2px,-2px)}

/* ── 选树小窗（封存到哪棵树；每棵最多 31 天，挂满不可选）── */
.pickwrap{position:fixed;inset:0;z-index:50;display:none}
.pickwrap.open{display:block}
.pickveil{position:absolute;inset:0;background:rgba(20,20,20,.28)}
.pick{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(86vw,340px);max-height:min(56vh,400px);overflow-y:auto;
  background:var(--paper);border:1px solid #e7e7e7;box-shadow:0 20px 48px -24px rgba(0,0,0,.4);
  padding:8px;scrollbar-width:none;-ms-overflow-style:none}
.pick::-webkit-scrollbar{display:none}
.phead{text-align:center;font-family:var(--zh);font-size:12.5px;color:#8e8e8e;
  letter-spacing:.24em;text-indent:.24em;padding:8px 0 10px}
.pi{display:flex;justify-content:space-between;align-items:baseline;gap:10px;width:100%;
  padding:10px 12px;background:none;border:0;cursor:pointer;text-align:left}
.pi:hover{background:#f4f4f4}
.pi .pz{font-family:var(--zh);font-size:14px;color:#2a2a2a;letter-spacing:.1em;white-space:nowrap}
.pi .pe{font-family:var(--lat);font-size:9.5px;letter-spacing:.12em;color:#8e8e8e;text-align:right;white-space:nowrap}
.pi.full{opacity:.45;cursor:default}
.pi.add{border-top:1px solid #ececec;margin-top:6px;padding-top:12px}
.pi.add .pz{color:#6d6d6d}
/* 牌命名（2026-09-14 定）：命名的是「那天」不是树 —— 封存落位后弹命名框，已封存随时改 */
.relink{display:none;font-family:var(--zh);font-size:11px;letter-spacing:.18em;color:#9a9a9a;
  background:none;border:0;cursor:pointer;padding:4px 2px;transition:color .15s}
.relink:hover{color:#000}
.relink.show{display:inline-block}
.nbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(86vw,340px);background:var(--paper);border:1px solid #e7e7e7;
  box-shadow:0 20px 48px -24px rgba(0,0,0,.4);padding:8px}
.nrow{display:flex;gap:8px;align-items:center;padding:6px 10px 10px}
.nin{flex:1;min-width:0;font-family:var(--zh);font-size:13px;color:#2a2a2a;letter-spacing:.08em;
  background:none;border:0;border-bottom:1px solid #cfcfcf;padding:4px 2px;outline:none}
.nin:focus{border-bottom-color:#2a2a2a}
.nin::placeholder{color:#c0c0c0;letter-spacing:.14em}
.nok,.nno{background:none;border:0;cursor:pointer;font-family:var(--zh);font-size:11px;
  letter-spacing:.16em;color:#8e8e8e;padding:4px 2px;white-space:nowrap}
.nok{color:#2a2a2a}
.nok:hover,.nno:hover{color:#000}

/* ── 花瓣层 ────────────────────────────────────────────────
   灰阶半透明、小而少：从右上角树梢慢慢飘落 → 触地停 2s → 渐隐。
   整层 fixed 覆盖视口、不吃点击；canvas 由内联脚本驱动。
   ───────────────────────────────────────────────────── */
#petalLayer{position:fixed;left:0;top:0;width:100%;height:100%;
  pointer-events:none;z-index:6}
@media (prefers-reduced-motion:reduce){#petalLayer{display:none}}

@media(max-width:560px){
  .hero-bg{background-position:70% 10%}
  .letter{font-size:13.5px;line-height:31px;
    background-image:repeating-linear-gradient(to bottom,
      rgba(0,0,0,0) 0px,rgba(0,0,0,0) 30px,var(--rule) 30px,var(--rule) 31px)}
  .lhead{height:31px}
  .letter p+p{margin-top:31px}
}
</style>
</head>
<body>
<button class="backbtn" type="button" aria-label="返回"><i></i></button>
<div class="page">
  <header class="hero">
    <div class="hero-bg"></div>
    <div class="hero-canopy"></div>
    <div class="hero-veil"></div>
  </header>

  <div class="titlewrap">
    <h1>Dear Memories.</h1>
  </div>

  <div class="arch"><i></i><span><span data-sd-owner>乔木</span> &middot; 记忆档案</span><i></i></div>

  <section class="daymeta">
    <p class="dayline"><span class="dnum">2026.08.24</span><span class="wk">周一</span><span class="sep">&middot;</span>共 <b>13</b> 条<span class="sep">&middot;</span><b>3,215</b> 字</p>
  </section>

  <div class="tabswrap">
    <nav class="tabs" id="chips"></nav>
  </div>

  <article class="letter" id="letter"></article>

  <footer class="signoff">
    <button class="seal" type="button">[ 封存这一天 ]</button>
  </footer>
</div>
<canvas id="petalLayer" aria-hidden="true"></canvas>
<script>
/* 来路判定（最先执行）：封存树点牌进来 = 绿色主题 + 返回回封存树（22:48 定） */
var SEAL_MODE = !!(location.search.match(/[?&]from=seal\b/) || document.referrer.indexOf("render-seal") > -1);
if (SEAL_MODE) document.body.classList.add("seal-mode");
// 退出键：记得来路 —— 封存树点牌进来的退回封存树，月树进来的回月树，直接打开兜底回月树
// 返回类跳转一律 location.replace（不往历史里加条目，避免「封存树↔单日页」按返回来回弹）
(function(){
  var bk = document.querySelector(".backbtn");
  if(!bk) return;
  bk.onclick = function(){
    if(SEAL_MODE){ location.replace("render-seal.html"); return; }
    if(document.referrer.indexOf("render-month") > -1 && history.length > 1){ history.back(); }
    else{ location.replace("render-month.html"); }
  };
})();
var RECS = [{"time":"08:40","sub":"悄悄话","chars":96,"milestone":false,"milestoneTitle":"","preview":"示例 · 清晨的悄悄话","text":"清晨的光落在桌角，我想把今天好好记下来。这一页是示例信笺——风一页一页翻，日子一天一天挂。"},{"time":"13:05","sub":"","chars":54,"milestone":true,"milestoneTitle":"小小的里程碑","preview":"示例 · 里程碑","text":"下午做成了件小事，值得挂牌。把这一刻封进树里，等以后回来看。"},{"time":"21:30","sub":"悄悄话","chars":71,"milestone":false,"milestoneTitle":"","preview":"示例 · 晚安前","text":"晚安前写两行。树上的牌轻轻晃，像有人在说：今天也辛苦了。"}];
var THIS_DAY = "2026-08-24", THIS_WK = "周一";
var API = (window.SD_CONFIG && window.SD_CONFIG.api) || "";
var OWNER = (window.SD_CONFIG && window.SD_CONFIG.owner) || "乔木";
var chips = document.getElementById("chips");
var letter = document.getElementById("letter");
function esc(s){return String(s).replace(/[&<>]/g,function(c){return c==="&"?"&amp;":c==="<"?"&lt;":"&gt;";});}
function comma(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,",");}
function render(i){
  var r = RECS[i], h = [], k, paras, t;
  h.push('<div class="lhead"><span class="lwho">' + OWNER + '：</span>');
  h.push('<span class="lmeta">第 '+(i+1)+' / '+RECS.length+' 笔 &middot; '+comma(r.chars)+' 字</span></div>');
  if(r.sub) h.push('<div class="lsub">'+esc(r.sub)+'</div>');
  if(r.milestone) h.push('<div class="lms">★ 里程碑'+(r.milestoneTitle?' · '+esc(r.milestoneTitle):'')+'</div>');
  paras = r.text.split("\n");
  for(k=0;k<paras.length;k++){
    t = paras[k].replace(/[ \t]+$/,"");
    if(!t) continue;
    h.push("<p"+(k?" class=\"p2\"":"")+">"+esc(t)+"</p>");
  }
  letter.innerHTML = h.join("");
  letter.classList.remove("fadein");
  void letter.offsetWidth;
  letter.classList.add("fadein");
}
// 选中的签滚进可视区（横滑时保证看得见当前那条）
function ensureVisible(el){
  if(!el || !chips) return;
  var L = el.offsetLeft, R = L + el.offsetWidth;
  if(L < chips.scrollLeft) chips.scrollLeft = L - 16;
  else if(R > chips.scrollLeft + chips.clientWidth) chips.scrollLeft = R - chips.clientWidth + 16;
}
function pick(i){
  i = Math.max(0, Math.min(RECS.length-1, i));
  var all = chips.querySelectorAll(".tab");
  for(var k=0;k<all.length;k++) all[k].className = "tab" + (k===i?" on":"");
  render(i);
  ensureVisible(all[i]);
  window.__cur = i;
}
function buildTabs(){
  var b, k;
  chips.innerHTML = "";
  for(k=0;k<RECS.length;k++){
    b = document.createElement("button");
    b.className = "tab";
    b.type = "button";
    b.title = RECS[k].preview || RECS[k].text.slice(0,60);
    b.innerHTML = esc(RECS[k].time) + (RECS[k].milestone ? '<span class="dot">\u2605</span>' : "");
    (function(idx){ b.onclick = function(){ pick(idx); }; })(k);
    chips.appendChild(b);
  }
}
(function(){
  buildTabs();
  document.addEventListener("keydown", function(e){
    if(e.key === "ArrowRight") pick((window.__cur||0)+1);
    if(e.key === "ArrowLeft")  pick((window.__cur||0)-1);
  });
  // 桌面端：在签条上滚轮 = 横滑
  chips.addEventListener("wheel", function(e){
    if(Math.abs(e.deltaY) > Math.abs(e.deltaX)){
      chips.scrollLeft += e.deltaY;
      e.preventDefault();
    }
  }, {passive:false});
  pick(0);
})();

/* ── 对接后台 qiaomu-web(:3010)（2026-09-14 v2 封存树）──
   1) 路由：?date=YYYY-MM-DD 指定打开哪一天（月树点牌带日期进来）；
      不带 = 构建默认那天。不是同一天先清空信笺，等水合，不闪旧日内容。
   2) 封存：点「封存这一天」弹选树小窗（默认 3 棵 · 每棵最多 31 天 · 可种新树），
      选定 POST /api/memories/seal { day, tree }；
      已封存 → 按钮显「已封存 · 记忆在此」，再点 = POST /api/memories/unseal 解封。
   3) 水合：拉 /api/memories/day?date=，统计行/时间签/标题/正文与后台对齐。
   后台离线时静默留在快照（页面照常可看）。 */
(function(){
  var mQ = location.search.match(/[?&]date=(\d{4}-\d{2}-\d{2})/);
  var ACTIVE = mQ ? mQ[1] : THIS_DAY;
  var sealBtn = document.querySelector(".seal");
  var trees = [], sealedTree = -1, labels = {};
  function wdZh(){ return "周" + "日一二三四五六".charAt(new Date(ACTIVE + "T12:00:00+08:00").getDay()); }
  function titleZh(){ var p = ACTIVE.split("-"); return p[0] + " 年 " + Number(p[1]) + " 月 " + Number(p[2]) + " 日"; }
  function comma(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
  function once(url, opt){ return fetch(API + url, opt).then(function(r){ return r.json(); }); }
  function labelOf(day){ return String(labels[day] || "").trim(); }
  function treeOf(day){
    for (var i = 0; i < trees.length; i++)
      if ((trees[i].days || []).indexOf(day) > -1) return i;
    return -1;
  }
  var relinkBtn = document.createElement("button");
  relinkBtn.className = "relink"; relinkBtn.type = "button";
  relinkBtn.textContent = "[ 改牌名 ]";
  sealBtn.parentNode.insertBefore(relinkBtn, sealBtn.nextSibling);
  function sealText(){
    if (sealedTree > -1){
      var lb = labelOf(ACTIVE);
      sealBtn.textContent = lb ? "[ 已封存 · " + lb + " ]" : "[ 已封存 · 记忆在此 ]";
      relinkBtn.classList.add("show");
    } else {
      sealBtn.textContent = "[ 封存这一天 ]";
      relinkBtn.classList.remove("show");
    }
  }
  function refreshState(){ sealedTree = treeOf(ACTIVE); sealText(); }
  /* 快照不是这一天 → 先清掉旧内容，等水合 */
  if (ACTIVE !== THIS_DAY){
    chips.innerHTML = ""; letter.innerHTML = "";
    var dl0 = document.querySelector(".dayline");
    if (dl0) dl0.innerHTML = '<span class="dnum">' + ACTIVE.replace(/-/g, ".") + '</span>';
    document.title = titleZh() + " · " + OWNER + "记忆档案";
  }
  once("/api/memories/sealed").then(function(j){
    if (!j.ok) return;
    trees = j.trees || [];
    labels = j.labels || {};
    refreshState();
  }).catch(function(){});

  /* ── 选树小窗（树固定叫 记忆在此封存·N，不参与命名）── */
  var wrap = document.createElement("div");
  wrap.className = "pickwrap";
  wrap.innerHTML = '<div class="pickveil"></div>' +
    '<div class="pick"><div class="phead">封存到哪棵树</div><div class="plist"></div></div>';
  document.body.appendChild(wrap);
  var plist = wrap.querySelector(".plist");
  function buildPick(){
    var h = "";
    for (var i = 0; i < trees.length; i++){
      var days = trees[i].days || [];
      var full = days.length >= 31;
      h += '<button class="pi' + (full ? " full" : "") + '" type="button" data-i="' + i + '"' +
           (full ? " disabled" : "") + '><span class="pz">第 ' + (i + 1) + ' 棵</span>' +
           '<span class="pe">' + days.length + ' / 31 天' + (full ? " · 挂满" : "") + '</span></button>';
    }
    h += '<div class="pi add" id="dayaddtree" role="button"><span class="pz">＋ 种一棵新树</span><span class="pe">NEW TREE</span></div>';
    plist.innerHTML = h;
    var bs = plist.querySelectorAll("button.pi");
    for (var b = 0; b < bs.length; b++){
      (function(btn){
        btn.addEventListener("click", function(){
          doSeal(parseInt(btn.getAttribute("data-i"), 10));
        });
      })(bs[b]);
    }
    document.getElementById("dayaddtree").addEventListener("click", function(){
      once("/api/memories/trees/add", { method: "POST", body: "{}" }).then(function(j){
        if (j.ok){
          trees = (j.trees || trees);
          if (j.labels) labels = j.labels;
          buildPick();
        }
      }).catch(function(){});
    });
  }
  function openPick(){ buildPick(); wrap.classList.add("open"); }
  function closePick(){ wrap.classList.remove("open"); }
  wrap.querySelector(".pickveil").addEventListener("click", closePick);
  addEventListener("keydown", function(e){ if (e.key === "Escape") closePick(); });

  /* ── 牌命名（封存落位后弹；已封存点「改牌名」随时改；树名不动）── */
  var nwrap = document.createElement("div");
  nwrap.className = "pickwrap";
  nwrap.innerHTML = '<div class="pickveil"></div>' +
    '<div class="nbox"><div class="phead">给这块牌起个名字</div>' +
    '<div class="nrow"><input class="nin" id="nin" maxlength="16" placeholder="写在这一天的牌上（可留空）">' +
    '<button class="nok" id="nok" type="button">记下</button>' +
    '<button class="nno" id="nno" type="button">先不用</button></div></div>';
  document.body.appendChild(nwrap);
  var nin = nwrap.querySelector("#nin");
  function openNaming(){
    nin.value = labelOf(ACTIVE);
    nwrap.classList.add("open");
    try { nin.focus(); } catch(e){}
  }
  function closeNaming(){ nwrap.classList.remove("open"); }
  function saveName(){
    once("/api/memories/label", { method: "POST", body: JSON.stringify({ day: ACTIVE, name: nin.value }) })
      .then(function(j){
        if (j.ok) labels = j.labels || labels;
      })
      .catch(function(){})
      .then(function(){ closeNaming(); sealText(); });
  }
  nwrap.querySelector("#nok").addEventListener("click", saveName);
  nwrap.querySelector("#nno").addEventListener("click", closeNaming);
  nwrap.querySelector(".pickveil").addEventListener("click", closeNaming);
  nin.addEventListener("keydown", function(e){
    if (e.key === "Enter") saveName();
    if (e.key === "Escape") closeNaming();
  });
  relinkBtn.addEventListener("click", openNaming);

  function doSeal(i){
    sealBtn.textContent = "[ 封存中… ]";
    once("/api/memories/seal", { method: "POST", body: JSON.stringify({ day: ACTIVE, tree: i }) })
      .then(function(j){
        if (!j.ok) throw new Error(j.error || "api");
        trees = j.trees || trees;
        if (j.labels) labels = j.labels;
        refreshState();
        closePick();
        openNaming();      /* 落位后给这块牌起名，「先不用」= 保持默认日期 */
      })
      .catch(function(){
        sealBtn.textContent = "[ 暂时连不上记忆库 ]";
        setTimeout(sealText, 1800);
      });
  }
  sealBtn.addEventListener("click", function(){
    if (sealedTree > -1){
      sealBtn.textContent = "[ 解封中… ]";
      once("/api/memories/unseal", { method: "POST", body: JSON.stringify({ day: ACTIVE }) })
        .then(function(j){
          if (j.ok){
            trees = j.trees || trees;
            if (j.labels) labels = j.labels;   // 解封即删牌名
          }
          refreshState();
        })
        .catch(function(){
          sealBtn.textContent = "[ 暂时连不上记忆库 ]";
          setTimeout(sealText, 1800);
        });
    } else if (trees.length){
      openPick();
    } else {
      sealBtn.textContent = "[ 暂时连不上记忆库 ]";
      setTimeout(sealText, 1800);
      once("/api/memories/sealed").then(function(j){
        if (j.ok){ trees = j.trees || []; refreshState(); }
      }).catch(function(){});
    }
  });

  /* ── 水合：正文/统计行/标题与后台对齐 ── */
  once("/api/memories/day?date=" + ACTIVE).then(function(j){
    if (!j.ok) return;
    var recs = (j.records || []).map(function(r){
      return { time: r.time, sub: (r.sub || "").trim(),
               chars: r.chars || String(r.text || "").length,
               milestone: !!r.milestone, milestoneTitle: r.milestone_title || "",
               text: String(r.text || "").replace(/<!--[\s\S]*?-->/g, "").replace(/\r\n?/g, "\n").trim() };
    }).sort(function(a, b){ return String(a.time).localeCompare(String(b.time)); });
    var same = ACTIVE === THIS_DAY && recs.length === RECS.length && recs.every(function(r, i){
      return r.time === RECS[i].time && r.chars === RECS[i].chars && r.text === RECS[i].text;
    });
    if (same) return;
    RECS.length = 0;
    if (recs.length){
      for (var i = 0; i < recs.length; i++) RECS.push(recs[i]);
    } else {
      RECS.push({ time: "", sub: "", chars: 0, milestone: false, milestoneTitle: "",
                  text: "这一天还没有留下字句。" });
    }
    buildTabs();
    pick(0);
    var total = 0;
    for (i = 0; i < RECS.length; i++) total += RECS[i].chars;
    var dl = document.querySelector(".dayline");
    if (dl) dl.innerHTML = '<span class="dnum">' + ACTIVE.replace(/-/g, ".") + '</span>' +
      '<span class="wk">' + wdZh() + '</span><span class="sep">&middot;</span>共 <b>' + RECS.length +
      '</b> 条<span class="sep">&middot;</span><b>' + comma(total) + '</b> 字';
    document.title = titleZh() + " · " + OWNER + "记忆档案";
  }).catch(function(){});
})();

/* ── 花瓣：双色分支（22:48 定）——封存树进来（?from=seal）是浅绿透明叶，
   正常详情页滚回原灰阶花瓣；其余行为不变：从右上角树梢出发，被一阵**微风**斜着吹向左下 ──
   落到底部后停 2 秒「躺在地上」，再渐渐消失、换一片重生。
   要求：唯美 · 不要太大 · **同时 6 片** · 要有微风感 ——
   出发永远在右上树梢（这条不变），但风要把它带过整张纸，
   所以**左下角也要看得到花瓣**（不是只在右边掉）。
   实现：每片先定「落点」（在纸宽 6%~80% 之间均布），再由落点反推风速，
   于是落点天然铺满全幅；风越靠近纸的左边越小 → 温柔地停在左缘，不会贴死。
   ─────────────────────────────────────────────────────── */
(function petals(){
  var cv = document.getElementById("petalLayer");
  if(!cv || !cv.getContext) return;
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var g = cv.getContext("2d");
  var hero = document.querySelector(".hero");
  var W = 0, H = 0, DPR = 1, t0 = 0, nextAt = 0;
  var MAX = 6, REST_MS = 2000, FADE_S = 1.15;
  var PL = 0, PR = 0;                 // 纸面左右边界（花瓣只在纸上飘，不落到灰底）
  var list = [];

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    cv.style.width = W + "px"; cv.style.height = H + "px";
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    var pg = document.querySelector(".page");
    var b = pg && pg.getBoundingClientRect ? pg.getBoundingClientRect() : null;
    PL = b ? b.left : 0;
    PR = b ? (b.right || b.left + b.width) : W;
  }
  resize();
  window.addEventListener("resize", resize);

  function rnd(a, b){ return a + Math.random() * (b - a); }
  function ground(){ return H - Math.max(12, Math.min(40, H * 0.042)); }

  // 树梢 = 卷首照片右上（底图焦点 74% 18% / 窄屏 70% 10%，松枝都在右上）
  function treeTop(){
    var b = hero ? hero.getBoundingClientRect()
                 : { left: W * 0.72, width: W * 0.28, top: 0, height: H * 0.3 };
    return {
      x: Math.min(W - 10, Math.max(10, rnd(b.left + b.width * 0.60, b.left + b.width * 0.98))),
      y: Math.min(H * 0.5, Math.max(-30, rnd(b.top + b.height * 0.10, b.top + b.height * 0.42))),
      spread: Math.min(150, b.width * 0.18)
    };
  }

  function spawn(fresh, frac){
    var t = treeTop(), GY = ground(), p;
    var pw = Math.max(240, PR - PL);
    var lo = PL + 8, hi = PR - 8;                        // 只在纸面上活动
    var x0 = Math.min(hi, Math.max(lo, fresh ? rnd(Math.max(lo, t.x - t.spread), t.x) : t.x));
    var vy = rnd(52, 84);
    // 从树梢落到底要多久（15~22s）；风的大小由「想落在哪儿」反推，
    // 这样窄屏（纸才 390px）不会被吹到贴死左边、宽屏也能一路飘到左下角。
    var fullT = Math.max(4, (GY - t.y) / vy);
    var landX = lo + pw * rnd(0.06, 0.80);               // 落点铺满左起 6%~80%
    if(landX > x0) landX = x0 - pw * rnd(0.06, 0.45);    // 微风只往左吹
    var wind = Math.max(-vy * 0.95, Math.min(vy * 0.35, (landX - x0) / fullT));
    var done = fresh && frac != null;
    // 开局那几片：按「已经飘了 frac 段」，预先挪到此刻该在的位置 ——
    // 于是一打开就是一串从右上斜着飘向左下的花瓣，而不是全挤在树梢
    var y0 = done ? t.y + (GY * 0.88 - t.y) * (frac + rnd(-0.12, 0.12)) : t.y;
    p = {
      x: Math.max(lo, Math.min(hi, x0 + wind * fullT * (done ? frac : 0))),
      y: done ? Math.max(-20, Math.min(GY * 0.88, y0)) : t.y,
      s: rnd(6.4, 9.2),
      vy: vy,
      wind: wind, gust: rnd(0.16, 0.34), gph: rnd(0, 6.283),   // 阵风：时强时弱
      amp: rnd(16, 30), freq: rnd(0.20, 0.42), ph: rnd(0, 6.283),
      rot: rnd(0, 6.283), rv: rnd(-0.5, 0.5),
      bow: rnd(0.60, 0.78), hip: rnd(0.46, 0.60),   // 每片形状略不同，不是复制粘贴
      tw: 1, turn: rnd(0.45, 1.05), tph: rnd(0, 6.283),  // 翻面（花瓣在空中打转时忽宽忽窄）
      a0: rnd(0.34, 0.48), alpha: 0, rotTo: 0,
      st: 0, at: 0
    };
    p.alpha = p.a0;
    list.push(p);
  }
  for(var i = 0; i < MAX - 1; i++) spawn(true, (i + 0.5) / (MAX - 1));
  spawn(false);

  function draw(p){
    g.save();
    g.translate(p.x, p.y);
    g.rotate(p.rot);
    g.scale(p.tw, 1);                    // 翻面：空中打转时忽宽忽窄
    g.globalAlpha = p.alpha;
    g.shadowBlur = 2.5;
    var grd = g.createLinearGradient(0, -p.s, 0, p.s);
    if (SEAL_MODE){
      g.shadowColor = "rgba(116,150,92,.4)";
      grd.addColorStop(0, "rgba(137,175,110,.78)");    /* 浅绿透明叶（封存树模式） */
      grd.addColorStop(0.55, "rgba(163,196,136,.6)");
      grd.addColorStop(1, "rgba(206,226,182,.42)");
    } else {
      g.shadowColor = "rgba(136,136,140,.5)";          /* 灰阶花瓣（正常详情页，滚回原样） */
      grd.addColorStop(0, "#a2a2a6");
      grd.addColorStop(0.55, "#c6c6c9");
      grd.addColorStop(1, "#eaeaea");
    }
    g.fillStyle = grd;
    g.beginPath();
    g.moveTo(0, -p.s);
    g.bezierCurveTo(p.s * p.bow, -p.s * 0.50, p.s * p.hip, p.s * 0.56, 0, p.s);
    g.bezierCurveTo(-p.s * p.hip, p.s * 0.56, -p.s * p.bow, -p.s * 0.50, 0, -p.s);
    g.closePath();
    g.fill();
    g.shadowBlur = 0;
    g.globalAlpha = p.alpha * 0.5;       // 极淡轮廓：让它在浅纸上仍看得出是叶/花瓣而不是灰点
    g.strokeStyle = SEAL_MODE ? "rgba(110,145,88,.45)" : "rgba(126,126,132,.55)";
    g.lineWidth = Math.max(0.5, p.s * 0.05);
    g.stroke();
    g.globalAlpha = p.alpha * 0.55;
    g.strokeStyle = "rgba(255,255,255,.9)";
    g.lineWidth = Math.max(0.5, p.s * 0.055);
    g.beginPath();
    g.moveTo(0, -p.s * 0.60);
    g.quadraticCurveTo(p.s * 0.12, 0, 0, p.s * 0.72);
    g.stroke();
    g.restore();
  }

  function frame(now){
    var dt = Math.min(0.05, (now - t0) / 1000);
    t0 = now;
    g.clearRect(0, 0, W, H);
    if(list.length < MAX && now > nextAt){
      // 渐隐状态的算 0.5 片，保证旧的「真没了」才补新，避免瞬间超 6
      var alive = 0; for(var i = 0; i < list.length; i++) alive += (list[i].st === 2 ? 0.5 : 1);
      if(alive + 0.5 <= MAX){
        spawn(false);
        nextAt = now + rnd(2500, 4200);     // 留足 REST_MS(2000)+FADE_S(1150) 的余量
      } else {
        nextAt = now + 600;                 // 几百毫秒后再判定
      }
    }
    var lo = PL + 8, hi = PR - 8, room = Math.max(90, (hi - lo) * 0.22);

    for(var k = list.length - 1; k >= 0; k--){
      var p = list[k];
      if(p.st === 0){                                    // 飘落：被微风斜着吹向左下
        var breeze = 1 + 0.45 * Math.sin((now / 1000) * p.gust * 6.283 + p.gph);
        var soft = Math.min(1, Math.max(0, (p.x - lo) / room));   // 越靠纸的左边，风越小
        p.x += p.wind * breeze * soft * dt
             + Math.sin((now / 1000) * p.freq * 6.283 + p.ph) * p.amp * dt * 1.7;
        p.y += p.vy * dt;
        p.rot += p.rv * dt;
        p.tw = 0.34 + 0.66 * Math.abs(Math.cos((now / 1000) * p.turn + p.tph));
        // 软边界：只在纸面内（左右各留 8px），不飘到纸外的灰底上
        if(p.x < lo) p.x += (lo - p.x) * Math.min(1, dt * 1.6);
        if(p.x > hi) p.x += (hi - p.x) * Math.min(1, dt * 1.6);
        if(p.y >= ground()){
          p.y = ground(); p.st = 1; p.at = now;
          p.rotTo = Math.round(p.rot / Math.PI) * Math.PI + Math.PI / 2;   // 落地躺平
        }
      } else if(p.st === 1){                             // 停在地上 2 秒
        p.rot += (p.rotTo - p.rot) * Math.min(1, dt * 6);
        p.tw += (1 - p.tw) * Math.min(1, dt * 5);
        p.y += 0.7 * dt;
        if(now - p.at >= REST_MS){ p.st = 2; p.at = now; }
      } else {                                           // 渐渐消失
        var f = Math.min(1, (now - p.at) / (FADE_S * 1000));
        p.alpha = p.a0 * (1 - f) * (1 - f);
        if(f >= 1){ list.splice(k, 1); continue; }
      }
      draw(p);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(function(n){ t0 = n; requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
